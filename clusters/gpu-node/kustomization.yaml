# GPU-node-profile overlay (IO-T005, GPU gate G6) — SHELL only this
# session: authored + validated against a live k3s API server
# (clusters/gpu-node/validate-k3s.sh) but never applied to a real cluster
# and never scheduled (no GPU rented; docs/gpu-node-profile.md,
# docs/implementation-notes.md "Deviations", extends D-1). Composes the
# CPU-realistic llama.cpp base (deploy/llama-cpp/base — the manifest form
# of the engine actually serving traffic via
# compose/docker-compose.llamacpp.yml) with the GPU-node-profile patch
# (nodeSelector/tolerations/nvidia.com/gpu resource limit — "as they WOULD
# be for a real GPU node", the honest artifact this task calls for).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inferops-gpu-node

resources:
  - namespace.yaml
  - ../../deploy/llama-cpp/base

patches:
  - path: gpu-profile-patch.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: gpu-node
    includeSelectors: false
