####################################################################
# inferops — observability stack (IO-T003), compose-pivot (see
# docker-compose.yml's header comment and docs/implementation-notes.md
# Deviations D-1).
#
# Topology (docs/observability.md, docs/architecture.md §4):
#   gateway --OTLP traces--> otel-collector --OTLP--> tempo
#   prometheus --scrape /metrics--> gateway   (direct; collector not in the
#                                               metrics path — see
#                                               otel/otel-collector-config.yaml)
#   grafana --queries--> prometheus, tempo   (exemplar link: trace_id -> tempo)
#
# All images pulled from Docker Hub/quay.io by digest (probe report: this
# path works; GitHub release-asset downloads do not). No :latest tags.
#
# Bring up with: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
####################################################################

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:2203eea06554f892c765d6eff8069cdf64ae8d4516526d03cab4a70e82775495
    container_name: inferops-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - inferops-net
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo@sha256:ef4384fce6e8ad22b95b243d8fc165628cda655376fd50e7850536ad89d71d50
    container_name: inferops-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - inferops-net

  prometheus:
    image: prom/prometheus@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: inferops-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=exemplar-storage"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Operator UI only — loopback-bound (docs/security.md §4: observability
      # UIs are port-forward/loopback access only, never a public exposure).
      - "127.0.0.1:9090:9090"
    networks:
      - inferops-net

  grafana:
    image: grafana/grafana@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    container_name: inferops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana_admin_password.txt:/run/secrets/grafana_admin_password:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Operator UI only — loopback-bound, same posture as Prometheus above.
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - inferops-net

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
