# IO-T004: this is the compose-pivot's stand-in for a Kubernetes Service +
# endpoint controller — the piece of infrastructure that, in a real cluster,
# stops routing to a pod the instant its readinessProbe fails and removes it
# from the Service's endpoint list. Docker Compose has no built-in load
# balancer, so haproxy plays that role for the rolling-update-under-load test
# (scripts/rolling-update-test.sh): it health-checks each gateway replica's
# own /readyz (the same endpoint a k8s readinessProbe would use) and only
# routes new requests to replicas currently passing it.
#
# `retry-on 503 + option redispatch` covers the gap between "a replica starts
# draining (SIGTERM -> /readyz flips to 503 immediately, per
# deploy/infergate.deployment-contract.json's graceful_termination.pre_stop)"
# and "haproxy's next health check notices" — a real Kubernetes Service
# reacts to a failed readinessProbe within roughly one probe period
# (endpoint-slice update latency), which is comparable to this health-check
# interval; the retry closes the remaining race window so a request that
# does land on a just-started-draining replica is transparently retried
# against the other replica instead of surfacing an error to the client.
global
    maxconn 256
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    retries 3
    option redispatch

frontend fe_gateway
    bind *:80
    default_backend be_gateway

backend be_gateway
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    retry-on 503 504 conn-failure empty-response
    default-server inter 500ms fall 1 rise 2
    server gw-a gateway-a:8080 check
    server gw-b gateway-b:8080 check
