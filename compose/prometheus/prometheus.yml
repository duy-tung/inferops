# IO-T003: scrapes the gateway's /metrics directly (bypasses the OTel
# Collector — see compose/otel/otel-collector-config.yaml's header comment).
# No relabel_configs that could introduce forbidden-cardinality labels
# (docs/observability.md §2 cardinality policy) — only the stock `job`/
# `instance` labels Prometheus adds itself.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: infergate-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          app: infergate
          component: gateway

  # IO-T005: the llama.cpp-backed gateway instance (backend="llamacpp" in
  # Contract 2 metric labels) and the engine's own Contract 4 metrics
  # endpoint. Both targets are optional at compose-up time (the `llamacpp`
  # profile is not started by default) — an absent target just shows as a
  # down scrape here, harmless.
  - job_name: infergate-gateway-llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-llamacpp:8080"]
        labels:
          app: infergate
          component: gateway-llamacpp

  - job_name: llama-cpp-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["llama-cpp:8080"]
        labels:
          app: llama-cpp
          component: engine

  # IO-T006/T007 fault campaign: ad hoc gateway instances the campaign
  # scripts create/recreate (docker run, same released digest, tuned
  # flags per scenario — faults/lib.sh). Container names are fixed and
  # reused across scenario runs so these targets are stable; a target is
  # simply "down" (harmless) between campaign runs when the container
  # doesn't exist.
  - job_name: infergate-gateway-faults
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-faults:8080"]
        labels:
          app: infergate
          component: gateway-faults

  - job_name: infergate-gateway-faults-a
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-faults-a:8080"]
        labels:
          app: infergate
          component: gateway-faults-a

  - job_name: infergate-gateway-faults-b
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-faults-b:8080"]
        labels:
          app: infergate
          component: gateway-faults-b

  # IO-T009 autoscaling experiments: ad hoc gateway instances
  # experiments/autoscaling/*.sh create/recreate (same released digest,
  # admission-sane-v1 flags — reuses faults/lib.sh's start_gateway/start_mock,
  # same pattern as the fault-campaign targets above). scrape_interval
  # overridden to 1s (vs the 5s global default) so a ~3.5 minute load ramp
  # yields enough samples per phase to compare signal responsiveness
  # meaningfully; harmless/down between experiment runs, same as the
  # fault-campaign targets. gateway-signals-2 only exists during the
  # 2-replica half of the scaling demonstration.
  - job_name: infergate-gateway-signals
    scrape_interval: 1s
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-signals:8080"]
        labels:
          app: infergate
          component: gateway-signals

  - job_name: infergate-gateway-signals-2
    scrape_interval: 1s
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-signals-2:8080"]
        labels:
          app: infergate
          component: gateway-signals-2

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          app: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
