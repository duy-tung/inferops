# Headless ClusterIP (StatefulSet-native), never exposed outside the
# cluster (docs/security.md §4) — no NodePort/LoadBalancer, ever.
apiVersion: v1
kind: Service
metadata:
  name: postgres-dev
  labels:
    app.kubernetes.io/name: postgres-dev
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres-dev
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
