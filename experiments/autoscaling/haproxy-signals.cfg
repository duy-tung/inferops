# IO-T009 scaling-demonstration LB — same role/config shape as
# compose/haproxy/haproxy.cfg (IO-T004) and faults/haproxy-faults.cfg
# (IO-T006/T007). Represents the "after" (2-replica) half of
# run-scaling-demo.sh's before/after comparison: both admission-sane-v1
# gateway replicas enabled behind one stable VIP, standing in for what a
# Kubernetes Service would front once the (never-actually-scheduled, RQ-14)
# HPA had scaled the Deployment to 2 pods. The "before" (1-replica) half of
# the same script talks directly to gateway-signals — no haproxy in front —
# since a load balancer over a single backend adds nothing to that
# measurement.

global
    maxconn 1024
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    retries 3
    option redispatch

frontend fe_gateway
    bind *:80
    default_backend be_gateway

backend be_gateway
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    retry-on 503 504 conn-failure empty-response
    default-server inter 500ms fall 1 rise 2
    server gw-1 gateway-signals:8080 check
    server gw-2 gateway-signals-2:8080 check
