# IO-T006/T007 fault-campaign fleet LB — same role/config shape as
# compose/haproxy/haproxy.cfg (IO-T004), pointed at the ad hoc no-auth
# gateway-faults-a/gateway-faults-b containers faults/lib.sh's
# start_fleet() creates, so scenarios 5 and 12 can drive load with
# inferbench (which sends no Authorization header) through a stable LB
# endpoint while replicas drain/restart one at a time.
global
    maxconn 256
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    retries 3
    option redispatch

frontend fe_gateway
    bind *:80
    default_backend be_gateway

backend be_gateway
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    retry-on 503 504 conn-failure empty-response
    default-server inter 500ms fall 1 rise 2
    server gw-a gateway-faults-a:8080 check
    server gw-b gateway-faults-b:8080 check
